<ng-template #contentNouvelleRencontre let-modal id="modalNouvelleRencontre">
  <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
    <div>
      <h5 class="modal-title fw-bold text-dark d-flex align-items-center gap-2">
        <i class="fa-solid fa-table-tennis-paddle-ball text-primary"></i>
        Nouvelle Rencontre
      </h5>
      <p class="text-muted small mb-0 mt-1">Sélectionnez la formule selon le nombre de joueurs par équipe.</p>
    </div>
    <button type="button" class="btn-close shadow-none" aria-label="Close" (click)="modal.close('Annuler')"></button>
  </div>

  <div class="modal-body p-4">
    <div class="row g-3">
      <!-- 3 Joueurs -->
      <div class="col-12 col-md-4">
        <div class="card h-100 border-2 card-selection-player text-center p-3 cursor-pointer" (click)="modal.close('3')">
          <div class="card-body d-flex flex-column align-items-center justify-content-between p-2">
            <div class="player-count-badge bg-primary-subtle text-primary fw-bold rounded-circle mb-3">
              3
            </div>
            <h6 class="card-title fw-bold text-dark mb-1">3 Joueurs</h6>
            <span class="badge bg-light text-secondary border mb-2">3 vs 3</span>
            <p class="card-text text-muted small m-0">9 Simples + 1 Double</p>
          </div>
        </div>
      </div>

      <!-- 4 Joueurs -->
      <div class="col-12 col-md-4">
        <div class="card h-100 border-2 card-selection-player text-center p-3 cursor-pointer" (click)="modal.close('4')">
          <div class="card-body d-flex flex-column align-items-center justify-content-between p-2">
            <div class="player-count-badge bg-success-subtle text-success fw-bold rounded-circle mb-3">
              4
            </div>
            <h6 class="card-title fw-bold text-dark mb-1">4 Joueurs</h6>
            <span class="badge bg-light text-secondary border mb-2">4 vs 4</span>
            <p class="card-text text-muted small m-0">16 Simples + 2 Doubles</p>
          </div>
        </div>
      </div>

      <!-- 6 Joueurs -->
      <div class="col-12 col-md-4">
        <div class="card h-100 border-2 card-selection-player text-center p-3 cursor-pointer" (click)="modal.close('6')" routerLink="/matchs/nouveau" routerLinkActive="active" ariaCurrentWhenActive="page">
          <div class="card-body d-flex flex-column align-items-center justify-content-between p-2">
            <div class="player-count-badge bg-danger-subtle text-danger fw-bold rounded-circle mb-3">
              6
            </div>
            <h6 class="card-title fw-bold text-dark mb-1">6 Joueurs</h6>
            <span class="badge bg-light text-secondary border mb-2">6 vs 6</span>
            <p class="card-text text-muted small m-0">18 Simples + 2 Doubles</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-footer border-top-0 pt-0 px-4 pb-4">
    <button type="button" class="btn btn-outline-secondary w-100 rounded-pill" (click)="modal.close('Annuler')">Annuler</button>
  </div>
</ng-template>

<a class="nav-link d-flex align-items-center gap-3 px-3 py-2 text-dark fw-medium text-decoration-none" (click)="openNouvelleRencontre(contentNouvelleRencontre)" style="cursor:pointer;">
  <i class="fa-solid fa-circle-plus text-success fs-5"></i>
  <span>Nouvelle rencontre</span>
</a>
