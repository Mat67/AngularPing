<app-navigation [app]="app" />

<app-toasts aria-live="polite" aria-atomic="true"></app-toasts>

<div class="container hero-container py-5 my-3">
  <!-- En-tête Club -->
  <div class="row justify-content-center text-center mb-4">
    <div class="col-lg-8">
      <div class="logo-wrapper mb-3">
        <img src="assets/logo-couleurs.png" alt="Étoile Pongiste Schleithal" class="img-fluid hero-logo">
      </div>
      <h1 class="h2 fw-bold text-dark mb-2">
        Étoile Pongiste Schleithal
      </h1>
      <p class="text-muted mx-auto mb-0 fs-5">
        Gestion des feuilles de rencontre
      </p>
    </div>
  </div>

  <!-- Actions principales -->
  <div class="row justify-content-center g-4 my-2">
    <!-- Action 1 : Nouvelle Rencontre -->
    <div class="col-md-5 col-lg-4">
      <div class="card h-100 border shadow-sm action-card p-3 text-center cursor-pointer" (click)="nrComp.open()">
        <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
          <div class="icon-circle bg-primary-subtle text-primary mb-3">
            <i class="fa-solid fa-table-tennis-paddle-ball fs-2"></i>
          </div>
          <h5 class="fw-bold text-dark mb-3">Nouvelle Rencontre</h5>
          <div class="w-100" (click)="$event.stopPropagation()">
            <app-nouvelle-rencontre #nrComp [app]="app" />
          </div>
        </div>
      </div>
    </div>

    <!-- Action 2 : Charger Rencontre -->
    <div class="col-md-5 col-lg-4">
      <div class="card h-100 border shadow-sm action-card p-3 text-center cursor-pointer" (click)="crComp.open()">
        <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
          <div class="icon-circle bg-success-subtle text-success mb-3">
            <i class="fa-solid fa-folder-open fs-2"></i>
          </div>
          <h5 class="fw-bold text-dark mb-3">Charger une Rencontre</h5>
          <div class="w-100" (click)="$event.stopPropagation()">
            <app-charger-rencontre #crComp [app]="app" />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
