<!-- Feuille de Match avec Bootstrap, prête à être intégrée dans Angular -->
<div class="container mt-4">

    <h2 class="text-center mb-4">Feuille de Match</h2>
  
    <!-- Section des joueurs (toujours visible en haut) -->
    <div class="row mb-4 text-center">
      <div class="col-6 font-weight-bold" id="player1-name">{{ rencontre.getNomJoueurEquipeReceveuse() }}</div>
      <div class="col-6 font-weight-bold" id="player2-name">{{ rencontre.getNomJoueurEquipeVisiteuse() }}</div>
    </div>
  
    <!-- Formulaire pour entrer les scores -->
    <form (ngSubmit)="onSubmit()">
  
      <!-- Manche 1 -->
      <div class="form-group">
        <label class="font-weight-bold text-center d-block">Manche 1</label>
        <div class="row">
          <div class="col-6">
            <input type="number" class="form-control" name="scoreA1" placeholder="Score Joueur 1" min="0" [(ngModel)]="scoreA1" required>
          </div>
          <div class="col-6">
            <input type="number" class="form-control" name="scoreB1" placeholder="Score Joueur 2" min="0" [(ngModel)]="scoreB1" required>
          </div>
        </div>
      </div>
  
      <!-- Manche 2 -->
      <div class="form-group">
        <label class="font-weight-bold text-center d-block">Manche 2</label>
        <div class="row">
          <div class="col-6">
            <input type="number" class="form-control" name="scoreA2" placeholder="Score Joueur 1" min="0" [(ngModel)]="scoreA2">
          </div>
          <div class="col-6">
            <input type="number" class="form-control" name="scoreB2" placeholder="Score Joueur 2" min="0" [(ngModel)]="scoreB2">
          </div>
        </div>
      </div>
  
      <!-- Manche 3 -->
      <div class="form-group">
        <label class="font-weight-bold text-center d-block">Manche 3</label>
        <div class="row">
          <div class="col-6">
            <input type="number" class="form-control" name="scoreA3" placeholder="Score Joueur 1" min="0" [(ngModel)]="scoreA3">
          </div>
          <div class="col-6">
            <input type="number" class="form-control" name="scoreB3" placeholder="Score Joueur 2" min="0" [(ngModel)]="scoreB3">
          </div>
        </div>
      </div>
  
      <!-- Manche 4 -->
      <div class="form-group">
        <label class="font-weight-bold text-center d-block">Manche 4</label>
        <div class="row">
          <div class="col-6">
            <input type="number" class="form-control" name="scoreA4" placeholder="Score Joueur 1" min="0" [(ngModel)]="scoreA4">
          </div>
          <div class="col-6">
            <input type="number" class="form-control" name="scoreB4" placeholder="Score Joueur 2" min="0" [(ngModel)]="scoreB4">
          </div>
        </div>
      </div>
  
      <!-- Manche 5 -->
      <div class="form-group">
        <label class="font-weight-bold text-center d-block">Manche 5</label>
        <div class="row">
          <div class="col-6">
            <input type="number" class="form-control" name="scoreA5" placeholder="Score Joueur 1" min="0" [(ngModel)]="scoreA5">
          </div>
          <div class="col-6">
            <input type="number" class="form-control" name="scoreB5" placeholder="Score Joueur 2" min="0" [(ngModel)]="scoreB5">
          </div>
        </div>
      </div>
  
      <!-- Bouton pour soumettre le résultat -->
      <button type="submit" class="btn btn-success btn-block">Enregistrer le Résultat</button>
    </form>
  </div>
