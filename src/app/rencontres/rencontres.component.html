<form class="row g-3 needs-validation" novalidate></form>

<table class="table table-striped">
  <thead>
    <tr class="text-center">
      <th scope="col" style="width: 7%;">#</th>
      <th scope="col" style="width: 24%;">Joueur 1</th>
      <th scope="col" style="width: 24%;">Joueur 2</th>
      <th scope="col" style="width: 7%;">1</th>
      <th scope="col" style="width: 7%;">2</th>
      <th scope="col" style="width: 7%;">3</th>
      <th scope="col" style="width: 7%;">4</th>
      <th scope="col" style="width: 7%;">5</th>
      <th scope="col" class="score" style="width: 5%;" class="text-center">A-F</th>
      <th scope="col" class="score" style="width: 5%;" class="text-center">U-Z</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let rencontre of match.rencontres; let i = index">

      <tr *ngIf="match.rencontres?.length < 20 || i < (match.rencontres?.length || 0) / 2"
        [ngStyle]="{ 'background-color': getBackgroundColor(rencontre) }">
        <ng-container *ngTemplateOutlet="rencontreRowTemplate; context: { $implicit: rencontre, i: i, match: match, equipeReceveuse: equipeReceveuse }"></ng-container>
      
      
      </tr>

      <!-- Ajoutez une ligne de séparation après la première moitié -->
      <tr *ngIf="match.rencontres?.length === 20 && i === match.rencontres?.length / 2">
        <td colspan="10" class="separation"></td>
      </tr>

      <tr *ngIf="match.rencontres?.length === 20 && i >= (match.rencontres?.length || 0) / 2"
        [ngStyle]="{ 'background-color': getBackgroundColor(rencontre) }">
        <ng-container *ngTemplateOutlet="rencontreRowTemplate; context:  { $implicit: rencontre, i: i, match: match, equipeReceveuse: equipeReceveuse }"></ng-container>
      </tr>
    </ng-container>
    <!-- Ajoutez une ligne de séparation après la première moitié 
      <ng-container *ngIf="i === match.rencontres.length/ 2">
        <tr class="separation">
          <td colspan="10"></td>
        </tr>
      </ng-container>
  
      <app-rencontre-row *ngIf="i >= (match.rencontres?.length || 0) / 2" [rencontre]="rencontre"></app-rencontre-row>-->
    <!-- Définissez le ng-template pour la ligne de rencontre -->
    <ng-template #rencontreRowTemplate let-rencontre let-i="i" let-match="match" let-equipeReceveuse="equipeReceveuse" >
      <td scope="row" style="text-align: center; font-weight: bold;">{{ rencontre.getFormule() }}</td>
      <td>
        <div *ngIf="rencontre.getTypeRencontre() === 'RencontreSimple'; then thenBlock else elseBlock"></div>
        <ng-template #thenBlock>
          <div id="{{ i }} d" *ngIf="!cacherCompositionEquipeReceveuse">{{ rencontre.getNomJoueurEquipeReceveuse() }}
          </div>
        </ng-template>
        <ng-template #elseBlock>
          <div class="dropdown" [ngClass]="{ 'show': dropdownOpen }">
            <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
              (click)="toggleDropdownEquipeReceveuse(i < 10 ? 0 : 1)" aria-haspopup="true" aria-expanded="dropdownOpen">
              {{ rencontre.doubleEquipeReceveuse || ' ' }} <!-- Affiche la valeur sélectionnée -->
            </button>

            <div class="dropdown-menu" [ngClass]="{ 'show': dropdownEquipeReceveuseOpen[i < 10 ? 0 : 1] }"
              aria-labelledby="dropdownMenuButton">
              <button *ngFor="let option of match.GetCompositionDoubleEquipeReceveuse()[i < 10 ? 0 : 1]"
                class="dropdown-item hoverable" (click)="selectOptionEquipeReceveuse(option.split('|')[0], rencontre, i < 10 ? 0 : 1)">

              <div *ngIf="option && option.trim() !== ''" class="flex-item">
                {{ option }} | 
                {{ match.equipeReceveuse.getJoueurByPosition(option.split('-')[0]).nom }} - 
                {{ match.equipeReceveuse.getJoueurByPosition(option.split('-')[1]).nom  }} <!-- Affichage détaillé -->
              </div>
              
              <div *ngIf="!option || option.trim() === ''">
                <span style="visibility: hidden;"></span>
              </div>

              </button>
            </div>
          </div>

        </ng-template>
      </td>
      <td>
        <div *ngIf="rencontre.getTypeRencontre() === 'RencontreSimple'; then thenBlock2 else elseBlock2"></div>
        <ng-template #thenBlock2>
          <div *ngIf="!cacherCompositionEquipeVisiteuse">{{ rencontre.getNomJoueurEquipeVisiteuse() }}</div>
        </ng-template>
        <ng-template #elseBlock2>
          <div class="dropdown" [ngClass]="{ 'show': dropdownOpen }">
            <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
              (click)="toggleDropdownEquipeVisiteuse(i < 10 ? 0 : 1)" aria-haspopup="true" aria-expanded="dropdownOpen">
              {{ rencontre.doubleEquipeVisiteuse || ' ' }} <!-- Affiche la valeur sélectionnée -->
            </button>

            <div class="dropdown-menu" [ngClass]="{ 'show': dropdownEquipeVisiteuseOpen[i < 10 ? 0 : 1] }"
              aria-labelledby="dropdownMenuButton">
              <button *ngFor="let option of match.GetCompositionDoubleEquipeVisiteuse()[i < 10 ? 0 : 1]"
                class="dropdown-item hoverable" (click)="selectOptionEquipeVisiteuse(option.split('|')[0], rencontre, i < 10 ? 0 : 1)">

                <div *ngIf="option && option.trim() !== ''" class="flex-item">
                  {{ option }} | 
                  {{ match.equipeVisiteuse.getJoueurByPosition(option.split('-')[0]).nom }} - 
                  {{ match.equipeVisiteuse.getJoueurByPosition(option.split('-')[1]).nom  }} <!-- Affichage détaillé -->
                </div>
              
              <div *ngIf="!option || option.trim() === ''">
                <span style="visibility: hidden;">Aucune donnée disponible</span>
              </div>

              </button>
            </div>
          </div>

        </ng-template>
      </td>
      <td *ngFor="let manche of rencontre.manches; index as y" style="text-align: center;">
        <input type="text" class="form-control manche" id="{{ 'manche' + i + y }}"
          (keypress)="omit_number(rencontre.manches[y].score, $event)" [(ngModel)]="rencontre.manches[y].score"
          name=" {{ 'manche' + i + y }}" style="padding: 0%;" (blur)="onBlurMethod()" autocomplete="off"
          appScoreValidation="rencontre.manches[y]" [readonly]="lectureSeule"
          [disabled]="(manche.score === '' && rencontre.getResultat() !== 0) || (y > 0 && rencontre.manches[y-1].score === '' && manche.score === '') " />
      </td>

      <td class="score">
        {{ rencontre.getPointEquipeReveuse() }}
      </td>
      <td class="score">
        {{ rencontre.getPointEquipeVisiteuse() }}
      </td>
    </ng-template>
  </tbody>


</table>
