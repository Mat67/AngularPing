<footer class="page-footer py-2 fixed-bottom bg-light border-top shadow-sm">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
            <div class="score-counter d-flex align-items-center">
                <span class="fw-bold d-none d-md-inline me-3 text-truncate" style="max-width: 250px;">
                    {{ match.equipeReceveuse.nomEquipe || 'Receveur' }} - {{ match.equipeVisiteuse.nomEquipe || 'Visiteur' }}  
                </span>
                <div class="d-flex align-items-center">
                    <div class="digit" id="digit1">{{ match.scoreEquipeReceveuse() }}</div>
                    <span class="separator px-1">-</span>
                    <div class="digit" id="digit3">{{ match.scoreEquipeVisiteuse() }}</div>
                </div>
            </div>
              
            <div class="d-flex align-items-center gap-2 ms-auto">
                <app-modal [match]="match" [godeMode]="godeMode"></app-modal>
                <button class="btn btn-success" (click)="imprimer()" [disabled]="!isButtonImprimerActif() && !isGodMode">Imprimer</button>
                <button class="btn btn-outline-primary" (click)="random()" *ngIf="isGodMode">Random</button>
            </div>
        </div>
    </div>
</footer>
